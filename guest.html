<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Guest Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Guest Dashboard</h2>
    <button onclick="logout()">Logout</button>

    <h3>Food Menu</h3>
    <p id="menuDisplay"></p>

    <h3>Cleaning Schedule</h3>
    <p id="cleaningDisplay"></p>

    <h3>Submit Vacation</h3>
    <input type="date" id="fromDate">
    <input type="date" id="toDate">
    <button onclick="submitVacation()">Submit</button>
    <p id="vacationMsg"></p>

    <h3>Report an Issue</h3>
    <textarea id="issueText" rows="3" cols="40" placeholder="Describe your issue..."></textarea>
    <br>
    <button onclick="submitIssue()">Report</button>
    <p id="issueMsg"></p>

    <script src="script.js"></script>
</body>
</html>
